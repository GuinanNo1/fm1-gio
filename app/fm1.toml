# GIO-1's build settings (fm1-base's tools/build.py: ./build.sh)
name = "GIO"                   # the build's files: gio.fwsc, gio-X.Y.fwsc
id_prefix = "FM-1_4"           # package identity: dev FM-1_400, releases FM-1_4XXYYZZ (check it is free on the Firmware Hub)
usb_manufacturer = "GIO-1"
usb_product = "GIO-1 FM-1"
ble = false                    # GIO-1 never uses the radio
usb_audio_in = true            # the music recordable over USB
usb_audio_out = false
words = "words.tsv"
include = ["dsp"]
o2 = ["dsp/gio.c"]             # the engine, at -O2
# the site
tagline = "A generative electronic disco machine for the FM-1"
repo = ""
licence = "MPL-2.0"
credits = "A fork of AMB-1 by Charles Vestal. Built on fm1-base and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments)."
