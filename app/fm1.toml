# GIO-1's build settings (fm1-base's tools/build.py: ./build.sh)
name = "GIO"                   # the build's files: gio.fwsc, gio-X.Y.fwsc
id_prefix = "FM-1_58"          # package identity: dev FM-1_5800, releases FM-1_58XXYYZZ (free: no FM-1 firmware found on GitHub uses 5x, 2026-11)
usb_manufacturer = "GIO-1"
usb_product = "GIO-1 FM-1"
ble = false                    # GIO-1 never uses the radio
mirror = true                  # the screen and panel live on a computer (the site's Mirror page; fm1-base device/mirror.c)
usb_audio_in = true            # the music recordable over USB
usb_audio_out = false
words = "words.tsv"
include = ["dsp"]
o2 = ["dsp/gio.c"]             # the engine, at -O2
# the site
tagline = "A generative electronic disco machine for the FM-1"
repo = "https://github.com/GuinanNo1/fm1-gio"
licence = "MPL-2.0"
credits = "A fork of AMB-1 by Charles Vestal. Built on fm1-base and felucca-bsp, from Felucca by Leo Kuroshita (Hügelton Instruments)."
# firmware.json, for firmware hubs (fm1-base's docs/FIRMWARE-JSON.md; a release build refuses without these)
author = "Guinan"
description = "A generative disco machine after Giorgio Moroder's Munich sound. It plays itself: a sequenced bass, strings or choir, a lead that answers what you play on the white keys, four-on-the-floor drums. Nine songs, each a form with its own chords. Pick a song, key and bass pattern; hold or skip sections."
tags = ["generative", "groovebox", "sequencer"]
install = "https://guinanno1.github.io/fm1-gio/install/"
site = "https://guinanno1.github.io/fm1-gio/"
screenshot = "docs/img/screen-song.png"
